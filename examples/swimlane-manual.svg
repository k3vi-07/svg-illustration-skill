<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
  <!-- 手写泳道图示例：按 SKILL.md 约束（配色卡取色 / 字体回退链 / 无 emoji / 写前验宽 / 校验渲染）
       配色：晨雾蓝灰  surface#f8fafc border#e2e8f0 band#0f172a primary#3b82f6 accent#38bdf8 -->
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1000" height="560" fill="#f8fafc"/>
  <rect x="1" y="1" width="998" height="558" fill="none" stroke="#e2e8f0" stroke-width="2"/>

  <text x="40" y="56" font-family="Source Han Sans SC, Noto Sans CJK SC, LXGW WenKai, Smiley Sans, sans-serif" font-size="30" font-weight="bold" fill="#0f172a">泳道图 · 跨部门协作流程</text>
  <rect x="40" y="72" width="56" height="4" rx="2" fill="#3b82f6"/>

  <!-- 泳道 ×3：标签栏（band 深底白字，高对比）+ 道体（白底 border 分隔） -->
  <!-- 道1 用户 y=96..238 -->
  <rect x="40" y="96" width="920" height="142" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="40" y="96" width="56" height="142" fill="#0f172a"/>
  <text x="68" y="158" font-family="Source Han Sans SC, Noto Sans CJK SC, LXGW WenKai, Smiley Sans, sans-serif" font-size="22" font-weight="bold" fill="#f8fafc" text-anchor="middle">用</text>
  <text x="68" y="188" font-family="Source Han Sans SC, Noto Sans CJK SC, LXGW WenKai, Smiley Sans, sans-serif" font-size="22" font-weight="bold" fill="#f8fafc" text-anchor="middle">户</text>
  <!-- 道2 系统 y=238..380 -->
  <rect x="40" y="238" width="920" height="142" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="40" y="238" width="56" height="142" fill="#0f172a"/>
  <text x="68" y="300" font-family="Source Han Sans SC, Noto Sans CJK SC, LXGW WenKai, Smiley Sans, sans-serif" font-size="22" font-weight="bold" fill="#f8fafc" text-anchor="middle">系</text>
  <text x="68" y="330" font-family="Source Han Sans SC, Noto Sans CJK SC, LXGW WenKai, Smiley Sans, sans-serif" font-size="22" font-weight="bold" fill="#f8fafc" text-anchor="middle">统</text>
  <!-- 道3 客服 y=380..522 -->
  <rect x="40" y="380" width="920" height="142" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="40" y="380" width="56" height="142" fill="#0f172a"/>
  <text x="68" y="442" font-family="Source Han Sans SC, Noto Sans CJK SC, LXGW WenKai, Smiley Sans, sans-serif" font-size="22" font-weight="bold" fill="#f8fafc" text-anchor="middle">客</text>
  <text x="68" y="472" font-family="Source Han Sans SC, Noto Sans CJK SC, LXGW WenKai, Smiley Sans, sans-serif" font-size="22" font-weight="bold" fill="#f8fafc" text-anchor="middle">服</text>

  <!-- 节点（140×54，文案 64px 已验宽） -->
  <rect x="120" y="140" width="140" height="54" rx="27" fill="#0f172a" stroke="#3b82f6" stroke-width="3"/>
  <text x="190" y="174" font-family="Source Han Sans SC, Noto Sans CJK SC, LXGW WenKai, Smiley Sans, sans-serif" font-size="17" font-weight="bold" fill="#f8fafc" text-anchor="middle">提交申请</text>

  <rect x="260" y="282" width="140" height="54" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="330" y="316" font-family="Source Han Sans SC, Noto Sans CJK SC, LXGW WenKai, Smiley Sans, sans-serif" font-size="17" fill="#0f172a" text-anchor="middle">自动审核</text>

  <rect x="505" y="282" width="140" height="54" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="575" y="316" font-family="Source Han Sans SC, Noto Sans CJK SC, LXGW WenKai, Smiley Sans, sans-serif" font-size="17" fill="#0f172a" text-anchor="middle">生成工单</text>

  <rect x="505" y="424" width="140" height="54" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="575" y="458" font-family="Source Han Sans SC, Noto Sans CJK SC, LXGW WenKai, Smiley Sans, sans-serif" font-size="17" fill="#0f172a" text-anchor="middle">人工复核</text>

  <rect x="750" y="424" width="140" height="54" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="820" y="458" font-family="Source Han Sans SC, Noto Sans CJK SC, LXGW WenKai, Smiley Sans, sans-serif" font-size="17" fill="#0f172a" text-anchor="middle">处理完成</text>

  <rect x="750" y="140" width="140" height="54" rx="27" fill="#0f172a" stroke="#22c55e" stroke-width="3"/>
  <text x="820" y="174" font-family="Source Han Sans SC, Noto Sans CJK SC, LXGW WenKai, Smiley Sans, sans-serif" font-size="17" font-weight="bold" fill="#f8fafc" text-anchor="middle">确认结果</text>

  <!-- 箭头（跨道折线 + 同道直线，全矢量 marker） -->
  <path d="M 260 167 H 330 V 282" fill="none" stroke="#64748b" stroke-width="2.2" marker-end="url(#ar)"/>
  <line x1="400" y1="309" x2="505" y2="309" stroke="#64748b" stroke-width="2.2" marker-end="url(#ar)"/>
  <line x1="575" y1="336" x2="575" y2="424" stroke="#64748b" stroke-width="2.2" marker-end="url(#ar)"/>
  <line x1="645" y1="451" x2="750" y2="451" stroke="#64748b" stroke-width="2.2" marker-end="url(#ar)"/>
  <path d="M 820 424 V 194" fill="none" stroke="#64748b" stroke-width="2.2" marker-end="url(#ar)"/>
</svg>
