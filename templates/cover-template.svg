<svg xmlns="http://www.w3.org/2000/svg" width="900" height="383" viewBox="0 0 900 383">
  <!--
    公众号封面模板（2.35:1）
    使用前必做：
      1. fc-match 验证字体，把下面 font-family 换成验证过的中文字体（勿写不存在的字体名）
      2. python3 scripts/check.py 本文件（留白阈值 40px）验算文字宽度/溢出/emoji
    设计规则（见 SKILL.md）：
      - 四周留白 ≥40px；标题区 / 徽章区 / 底部结论条分区独立，不共用高度带
      - 文字放纯色背景；胶囊框宽 = 文字估宽 + 左右各 ≥15px
      - 无 emoji（rsvg 会渲染成方块）
      - 分享时按 1:1 居中裁剪（左右各裁约 258px），核心信息放中间 1:1 区（x≈258~642）
  -->
  <defs>
    <style>
      text { font-family: "Source Han Sans SC", "Noto Sans CJK SC", "LXGW WenKai", "Smiley Sans", sans-serif; }
    </style>
  </defs>

  <!-- 深色主背景 -->
  <rect width="900" height="383" fill="#16223a"/>

  <!-- 底部结论条（独立高度带） -->
  <rect x="0" y="303" width="900" height="80" fill="#141f36"/>
  <rect x="0" y="303" width="150" height="80" fill="#1A6FC4"/>

  <!-- 标题区 -->
  <text x="40" y="118" font-size="46" font-weight="bold" fill="#ffffff">这里是主标题，一句话讲清</text>
  <text x="40" y="168" font-size="26" fill="#4EA8E8">副标题 / 摘要：补一句关键信息</text>

  <!-- 徽章（胶囊）：框宽 = 估宽 + 两侧余量 -->
  <rect x="40" y="205" rx="23" width="230" height="46" fill="#F5A623"/>
  <text x="155" y="236" font-size="24" font-weight="bold" fill="#16223a" text-anchor="middle">深度分析</text>

  <!-- 底部结论文字（放在底部纯色条上） -->
  <text x="180" y="352" font-size="26" fill="#ffffff">一句结论 / 行动号召</text>
</svg>
